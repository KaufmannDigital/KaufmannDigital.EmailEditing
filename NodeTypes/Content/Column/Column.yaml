'KaufmannDigital.EmailEditing:Content.Column':
  superTypes:
    'Neos.Neos:Content': true
    'Neos.Neos:ContentCollection': true
    'KaufmannDigital.EmailEditing:Mixin.EmailContent': true
    'KaufmannDigital.EmailEditing:Mixin.Background.BackgroundColor': true
    'KaufmannDigital.EmailEditing:Mixin.Attributes.Padding': true
    'KaufmannDigital.EmailEditing:Mixin.Attributes.Width': true
  constraints:
    nodeTypes:
      '*': false
      'KaufmannDigital.EmailEditing:Content.Headline': true
      'KaufmannDigital.EmailEditing:Content.Text': true
      'KaufmannDigital.EmailEditing:Content.Divider': true
      'KaufmannDigital.EmailEditing:Content.Button': true
      'KaufmannDigital.EmailEditing:Content.Image': true
      'KaufmannDigital.EmailEditing:Content.Spacer': true
  properties:
    verticalAlign:
      type: string
      ui:
        label: i18n
        reloadIfChanged: true
        help:
          message: i18n
        inspector:
          group: positionOptions
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
          editorOptions:
            placeholder: i18n
            allowEmpty: true
            values:
              'top':
                label: i18n
              'middle':
                label: i18n
              'bottom':
                label: i18n

    textFontColor:
      type: string
      ui:
        label: i18n
        reloadIfChanged: true
        help:
          message: i18n
        inspector:
          group: background

    headlineFontColor:
      type: string
      ui:
        label: i18n
        reloadIfChanged: true
        help:
          message: i18n
        inspector:
          group: background

  ui:
    label: i18n
    icon: 'box'
    group: emailEditing
    position: 20

