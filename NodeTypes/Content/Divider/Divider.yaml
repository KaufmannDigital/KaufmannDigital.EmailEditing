'KaufmannDigital.EmailEditing:Content.Divider':
  superTypes:
    'Neos.Neos:Content': true
    'KaufmannDigital.EmailEditing:Mixin.EmailContent': true
    'KaufmannDigital.EmailEditing:Mixin.Attributes.Padding': true
  ui:
    label: i18n
    icon: 'fas fa-grip-lines'
    group: emailEditing
    inlineEditable: true
    inspector:
      groups:
        dividerOptions:
          label: i18n
          icon: 'fas fa-grip-lines'
  properties:
    borderColor:
      type: string
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: dividerOptions
          editorOptions:
            placeholder: i18n
    borderStyle:
      type: string
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: dividerOptions
          editor: 'Neos.Neos/Inspector/Editors/SelectBoxEditor'
          editorOptions:
            placeholder: i18n
            allowEmpty: true
            values:
              'solid':
                label: i18n
              'dotted':
                label: i18n
              'dashed':
                label: i18n
    borderWidth:
      type: integer
      ui:
        label: i18n
        reloadIfChanged: true
        inspector:
          group: dividerOptions
          editorOptions:
            placeholder: i18n
    padding:
      ui:
        inspector:
          editorOptions:
            placeholder: i18n


